<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARTIFY</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Inter", sans-serif;
            background: #f4f7f5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #17221b;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
            padding: 24px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 42px 38px 36px;
            box-shadow: 0 20px 50px rgba(16, 37, 26, 0.10);
            border: 1px solid #e7ece9;
        }

        .brand {
            text-align: center;
            margin-bottom: 34px;
        }

        .brand-name {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #166534;
        }

        .brand-line {
            width: 42px;
            height: 4px;
            background: #166534;
            border-radius: 10px;
            margin: 10px auto 0;
        }

        .login-heading {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-heading h1 {
            font-size: 24px;
            font-weight: 700;
            color: #17221b;
            margin-bottom: 8px;
        }

        .login-heading p {
            font-size: 14px;
            color: #718078;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #34423a;
            margin-bottom: 8px;
        }

        .input-wrapper input {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid #d8e0db;
            border-radius: 10px;
            background: #fbfcfb;
            font-family: inherit;
            font-size: 14px;
            color: #17221b;
            outline: none;
            transition: 0.2s ease;
        }

        .input-wrapper input:focus {
            border-color: #166534;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(22, 101, 52, 0.10);
        }

        .input-wrapper input::placeholder {
            color: #a0aaa4;
        }

        .error-message {
            background: #fff3f3;
            border: 1px solid #f2cccc;
            color: #b42318;
            border-radius: 9px;
            padding: 11px 13px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .login-button {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 10px;
            background: #166534;
            color: #ffffff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
            margin-top: 4px;
        }

        .login-button:hover {
            background: #14532d;
            transform: translateY(-1px);
            box-shadow: 0 7px 18px rgba(22, 101, 52, 0.20);
        }

        .footer {
            text-align: center;
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid #edf1ee;
        }

        .footer p {
            font-size: 12px;
            color: #9aa49e;
        }

        @media (max-width: 480px) {
            .login-wrapper {
                padding: 16px;
            }

            .login-card {
                padding: 34px 24px 28px;
                border-radius: 16px;
            }

            .brand-name {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <div class="brand">
            <div class="brand-name">SARTIFY</div>
            <div class="brand-line"></div>
        </div>

        <div class="login-heading">
            <h1>Welcome Back</h1>
            <p>Sign in to continue</p>
        </div>

        {% if form.errors %}
        <div class="error-message">
            Invalid username or password. Please try again.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_username">Username</label>

                <div class="input-wrapper">
                    <input
                        type="text"
                        name="username"
                        id="id_username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="id_password">Password</label>

                <div class="input-wrapper">
                    <input
                        type="password"
                        name="password"
                        id="id_password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>
            </div>

            <button type="submit" class="login-button">
                Sign In
            </button>

        </form>

        <div class="footer">
            <p>SARTIFY</p>
        </div>

    </div>

</div>

</body>
</html>
