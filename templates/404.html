<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            color: #1f2937;
        }

        .container {
            text-align: center;
            background: white;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            width: 90%;
        }

        .code {
            font-size: 72px;
            font-weight: 700;
            color: #166534;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            margin: 0 0 25px;
            color: #6b7280;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            padding: 12px 24px;
            background: #166534;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }

        a:hover {
            background: #14532d;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="code">404</div>

        <h1>Page Not Found</h1>

        <p>
            The page you are looking for does not exist.
        </p>

        <a href="/login/">
            Back to Login
        </a>

    </div>

</body>
</html>
