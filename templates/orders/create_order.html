<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Place Order - Food Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }

        .back {
            margin-left: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Place Food Order</h1>

    <h2>{{ daily_menu.get_day_of_week_display }}</h2>

    <p>
        Order date: {{ order_date }}
    </p>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Place Order
        </button>

        <a class="back" href="{% url 'dashboard' %}">
            Back to Dashboard
        </a>

    </form>

</div>

</body>
</html>
